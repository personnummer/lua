name: test

on:
  push:
    branches:
      - main

  # Run tests for any PRs.
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        luaVersion: ["5.1", "5.2", "5.3", "5.4", "luajit", "luajit-openresty"]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - uses: leafo/gh-actions-lua@5da8baa1cf64f003e76f002fc4a57043afd04267 # master
      with:
        luaVersion: ${{ matrix.luaVersion }}

    - uses: leafo/gh-actions-luarocks@1957dcb6bbe0e44584217d6c342fa8f60ac406ce # master

    - name: Install dependencies
      run: |
        luarocks install luacheck
        luarocks install busted
        luarocks install http

    - name: build
      run: luarocks make

    - name: Lint and test
      run: |
        luacheck src/init.lua
        busted spec